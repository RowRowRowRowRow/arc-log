<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ARC Log: PPL × UL Tracker</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo">ARC</span> Log</div>
    <button class="icon-btn" data-a="settings" aria-label="Settings">⚙︎</button>
  </header>

  <main id="view"></main>

  <div id="timer" class="timer hidden">
    <div class="timer-bar"><div id="timer-fill"></div></div>
    <div class="timer-row">
      <span class="timer-label">Rest</span>
      <span id="timer-text">0:00</span>
      <button data-a="timer-add" data-v="-15">−15</button>
      <button data-a="timer-add" data-v="15">+15</button>
      <button data-a="timer-stop">Skip</button>
    </div>
  </div>

  <nav class="tabs">
    <button data-a="tab" data-v="today" class="active"><span>🏋️</span>Today</button>
    <button data-a="tab" data-v="split"><span>🗓️</span>Split</button>
    <button data-a="tab" data-v="machines"><span>⚙️</span>Machines</button>
    <button data-a="tab" data-v="progress"><span>📈</span>Progress</button>
    <button data-a="tab" data-v="guide"><span>📘</span>Guide</button>
  </nav>

  <div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
  <div id="toast" class="toast hidden"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
